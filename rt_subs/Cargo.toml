[package]
name = "rt_subs"
version = "0.1.0"
edition = "2024"
description = "Signal-processing core for real-time JP->EN subtitles: resampling, Whisper log-mel, VAD segmentation, AlignAtt policy"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
realfft = "3.5.0"
wasm-bindgen = "0.2.128"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-simd"]
